services:
  node0:
    build:
      context: ../baseline_chord
      dockerfile: Dockerfile
    image: baseline-chord:latest
    container_name: baseline-node-0
    cap_add:
      - NET_ADMIN
    environment:
      - PORT=8000
      - ADVERTISE_ADDR=baseline-node-0:8000
      - BOOTSTRAP_ADDR=
      - M=160
      - R=4
      - STABILIZE_INTERVAL_MS=150
      - FIX_FINGERS_INTERVAL_MS=100
      - CHECK_PRED_INTERVAL_MS=200
    ports:
      - "8000:8000"
    networks:
      - chord-net

  node1:
    image: baseline-chord:latest
    container_name: baseline-node-1
